<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE881"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA7A1E"/>
      <stop offset="100%" stop-color="#734F0A"/>
    </linearGradient>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C1D37"/>
      <stop offset="100%" stop-color="#580F1E"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Emblem Symbol -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield / Pentagon -->
    <polygon points="50,2 96,25 80,88 50,102 20,88 4,25" fill="url(#maroonGrad)" stroke="url(#goldGrad)" stroke-width="3" filter="url(#shadow)"/>
    <polygon points="50,8 90,28 75,82 50,95 25,82 10,28" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="2,2"/>
    
    <!-- West Java Kujang Icon Stylized -->
    <path d="M50,18 C53,24 58,28 58,36 C58,45 52,52 50,60 C48,52 42,45 42,36 C42,28 47,24 50,18 Z" fill="url(#goldGrad)"/>
    <circle cx="50" cy="38" r="3" fill="#580F1E"/>
    <circle cx="50" cy="48" r="2.2" fill="#580F1E"/>
    
    <!-- Open Book / Education Base -->
    <path d="M28,68 C38,64 46,67 50,71 C54,67 62,64 72,68 C68,76 56,76 50,74 C44,76 32,76 28,68 Z" fill="url(#goldGrad)"/>
    <!-- Three Stars (PAUD, Dikdas, Dikmen) -->
    <polygon points="50,78 52,83 57,83 53,86 54,91 50,88 46,91 47,86 43,83 48,83" fill="#FFF"/>
    <polygon points="36,74 37.5,78 41.5,78 38.5,80.5 39.5,84.5 36,82 32.5,84.5 33.5,80.5 30.5,78 34.5,78" fill="url(#goldGrad)"/>
    <polygon points="64,74 65.5,78 69.5,78 66.5,80.5 67.5,84.5 64,82 60.5,84.5 61.5,80.5 58.5,78 62.5,78" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography -->
  <!-- BAN-PDM PROV JAWA BARAT -->
  <text x="125" y="38" font-family="'Cinzel', 'Trajan Pro', 'Cinzel Decorative', 'Georgia', serif" font-weight="900" font-size="22" fill="#6B1426" letter-spacing="2">
    BAN - PDM
  </text>
  <text x="268" y="38" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="800" font-size="16" fill="#D4AF37" letter-spacing="1.5">
    PROVINSI JAWA BARAT
  </text>
  
  <text x="125" y="60" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#4A4A4A" letter-spacing="0.8">
    BADAN AKREDITASI NASIONAL PENDIDIKAN ANAK USIA DINI,
  </text>
  <text x="125" y="76" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#4A4A4A" letter-spacing="0.8">
    PENDIDIKAN DASAR, DAN PENDIDIKAN MENENGAH
  </text>
  
  <rect x="125" y="86" width="360" height="2" fill="url(#goldGrad)"/>
  <text x="125" y="103" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="600" font-size="9.5" fill="#8C1D37" letter-spacing="2.5">
    AKREDITASI BERMUTU • PENDIDIKAN UNGGUL JAWA BARAT
  </text>
</svg>